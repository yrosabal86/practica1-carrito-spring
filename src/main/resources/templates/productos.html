<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Productos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h1>Catálogo de Productos</h1>

    <div class="mb-3">
        <a th:href="@{/}" class="btn btn-secondary">Inicio</a>
        <a th:href="@{/products/add}" class="btn btn-primary">Añadir producto</a>
        <a th:href="@{/cart}" class="btn btn-success">Ver carrito</a>
        <a th:href="@{/admin/export}" class="btn btn-warning">Exportar BD (SQL)</a>
    </div>

    <table class="table table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Nombre</th>
                <th>Precio</th>
                <th>Acciones</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="p : ${products}">
                <td th:text="${p.id}"></td>
                <td th:text="${p.name}"></td>
                <td th:text="${p.price} + ' €'"></td>
                <td>
                    <form th:action="@{/cart/add/{id}(id=${p.id})}" method="post" style="display:inline">
                        <button type="submit" class="btn btn-sm btn-success">Añadir al carrito</button>
                    </form>
                    <a th:href="@{/products/edit/{id}(id=${p.id})}" class="btn btn-sm btn-warning">Editar</a>
                    <form th:action="@{/products/delete/{id}(id=${p.id})}" method="post" style="display:inline">
                        <button type="submit" class="btn btn-sm btn-danger">Eliminar</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
