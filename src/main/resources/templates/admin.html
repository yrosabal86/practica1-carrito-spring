<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Administración</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-4">
    <h1>Panel de administración</h1>

    <div class="mb-3">
        <a th:href="@{/products/new}" class="btn btn-primary">Añadir producto</a>
        <a th:href="@{/products}" class="btn btn-warning">Editar / eliminar productos</a>
        <a th:href="@{/admin/export}" class="btn btn-success">Exportar BD (SQL)</a>
        <a th:href="@{/}" class="btn btn-secondary">Inicio</a>
    </div>

    <form th:action="@{/logout}" method="post">
        <button type="submit" class="btn btn-outline-danger">Cerrar sesión</button>
    </form>
</body>
</html>
